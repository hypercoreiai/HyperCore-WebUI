[pytest]
# Collection is scoped to tests/.
#
# Loop 41 leaves the Strata clone in tmp/ instead of removing it, and a bare pytest run
# from the repo root walks into that clone: its own test files import tools/_paths.py,
# which calls sys.exit() when llama.cpp's gguf-py is not on the box. Before this file the
# run stopped with a collection error before it reached anything of this project's.
#
# Nothing inside tests/ needs gguf-py - tests/test_pytest_scope.py keeps that true.
testpaths = tests
norecursedirs = tmp third_party .git .pytest_cache .venv

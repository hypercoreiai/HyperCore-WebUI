[pytest]
# Collection is scoped to tests/.
#
# Loop 41 leaves the Strata clone in tmp/ instead of removing it, and a bare pytest run
# from the repo root walks into that clone: its own test files import tools/_paths.py,
# which calls sys.exit() when llama.cpp's gguf-py is not on the box. Before this file the
# run stopped with a collection error before it reached anything of this project's.
#
# Nothing inside tests/ needs gguf-py - tests/test_pytest_scope.py keeps that true.
testpaths = tests serve/mcp/tests

# The `pytest` script does not put the directory it is run from on sys.path the way
# `python3 -m pytest` does, and every module in tests/ imports `serve`. conftest.py at
# the root covers a run whose rootdir is this repo; pythonpath covers the runs where it
# is not (a bare `pytest` from inside tests/, `-p no:cacheprovider`, a wrapper that
# passes -c). Both spellings of the command then collect the same files.
pythonpath = .
norecursedirs = tmp third_party .git .pytest_cache .venv

# serve/mcp/tests is the MCP hub's own contract suite (238 cases). Before this line it sat
# outside the collected set, so a routine run never touched it. serve/mcp/web-scrape-mcp/tests
# is deliberately not listed: it is a vendored third-party server with its own pyproject and
# its own pytest configuration.

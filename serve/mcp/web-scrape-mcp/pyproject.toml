[project]
name = "web-scrape-mcp"
version = "1.0.0"
description = "MCP server for sandboxed binary downloads and page media extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "filetype>=1.2.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
webscrape = "webscrape.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
